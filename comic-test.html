<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comic test</title>
<link rel="stylesheet" href="css/comic.css">
<style>
  /* Developer page (T4.1): pick a strip and play it. Turn the phone (or resize the window) to see the reflow.
     Options: ?strip=<id>, ?name=<player name>, ?still (reduced motion), ?step=<n> (jump ahead, for screenshots). */
  body { margin: 0; padding: 12px; background: #23393a; color: #eef6f4; font: 14px/1.3 system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bar button, .bar input { font: inherit; padding: 6px 12px; border-radius: 16px; border: 1px solid #6b9; background: #2f4c4d; color: inherit; }
  .bar button { cursor: pointer; }
  #log { white-space: pre-wrap; color: #ffd27a; }
  /* ?kit: the art kit preview (add &mouth to see where bubble tails point) */
  .kit-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .kit-row figure { margin: 0; background: #fdf3e7; border-radius: 8px; padding: 4px; color: #2a211d; text-align: center; }
  .kit-row svg { display: block; height: auto; }
  h3 { margin: 14px 0 6px; font-size: 14px; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <label>Name <input id="name" maxlength="20" placeholder="(default)"></label>
  <label><input type="checkbox" id="still"> reduced motion</label>
</div>
<p id="log"></p>
<div id="kit"></div>
<script type="module">
// Developer page: lists the strips, checks each one against the string table, sound table and art kit, and plays it.
import { loadStrings, hasString, t } from './js/core/strings.js';
import { createSound } from './js/core/sound.js';
import { SOUND_TABLE } from './js/core/soundTable.js';
import { playComic } from './js/game/comic.js';
import { validateStrip } from './js/game/comic-logic.js';
import { STRIP as placeholder } from './js/data/comics/placeholder-strip.js';
import { STRIP as testStrip } from './js/data/comics/test-strip.js';
import { STRIP as strip0 } from './js/data/comics/strip-0.js';
import { STRIP as strip1 } from './js/data/comics/strip-1.js';
import { STRIP as strip2 } from './js/data/comics/strip-2.js';
import { STRIP as strip3 } from './js/data/comics/strip-3.js';
import { STRIP as strip4 } from './js/data/comics/strip-4.js';
import { STRIP as strip5 } from './js/data/comics/strip-5.js';
import { STRIP as books } from './js/data/comics/strip-books.js';
import { STRIP as mplant } from './js/data/comics/strip-mplant.js';
import { STRIP as mlamp } from './js/data/comics/strip-mlamp.js';
import { STRIP as mmastery } from './js/data/comics/strip-mmastery.js';
import { STRIP as mapron } from './js/data/comics/strip-mapron.js';
import { STRIP as mtweezers } from './js/data/comics/strip-mtweezers.js';
import { STRIP as mstar } from './js/data/comics/strip-mstar.js';
import { ARTS, EXPRESSIONS, POSES, OUTFITS, CHARACTERS, checkArtLayer } from './js/game/comic-art.js';

const STRIPS = [strip0, strip1, strip2, strip3, strip4, strip5, books,mplant, mlamp, mapron, mmastery, mtweezers, mstar, testStrip, placeholder]; // add new strips here to see them in the chooser
const params = new URLSearchParams(location.search);

/**
 * One preview tile: an SVG with some art layers and a small label under it.
 * @param {HTMLElement} row where to add it
 * @param {string} label caption (developer page only, not game text)
 * @param {number} w drawing width
 * @param {number} h drawing height
 * @param {object[]} layers art layers as in a strip
 * @returns {void}
 */
function tile(row, label, w, h, layers) {
  const fig = document.createElement('figure');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.style.width = `${w * 0.22 * Number(params.get('zoom') ?? 1)}px`;
  for (const l of layers) {
    const r = ARTS[l.art](l);
    svg.appendChild(r.node ?? r);
    if (r.mouth && params.has('mouth')) {
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      for (const [k, v] of Object.entries({ cx: r.mouth[0], cy: r.mouth[1], r: 8, fill: 'red' })) dot.setAttribute(k, v);
      svg.appendChild(dot);
    }
  }
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  fig.append(svg, cap);
  row.appendChild(fig);
}

/** The art kit preview (?kit): every expression, pose and outfit of the cast, and the props. @returns {void} */
function showKit() {
  const kit = document.getElementById('kit');
  /** A titled row of tiles. @param {string} title row name @returns {HTMLElement} the row */
  const row = (title) => {
    const h = document.createElement('h3');
    h.textContent = title;
    const r = document.createElement('div');
    r.className = 'kit-row';
    if (!params.get('rows') || title.includes(params.get('rows'))) kit.append(h, r); // &rows=husband shows only those rows
    return r;
  };
  for (const who of Object.keys(CHARACTERS)) {
    const r = row(`${who}: expressions`);
    for (const expr of Object.keys(EXPRESSIONS)) tile(r, expr, 400, 420, [{ art: who, x: 200, y: 430, pose: 'bust', expr, look: 1 }]);
  }
  for (const who of Object.keys(CHARACTERS)) {
    const r = row(`${who}: poses`);
    for (const pose of Object.keys(POSES).filter((p) => p !== 'lie')) {
      tile(r, pose, 600, 760, [{ art: who, x: 300, y: pose === 'bust' ? 600 : 740, pose, expr: 'happy', hold: pose === 'sit' ? 'remote' : undefined }]);
    }
  }
  const r = row('outfits');
  for (const outfit of Object.keys(OUTFITS)) tile(r, outfit, 500, 760, [{ art: outfit === 'hoodie' || outfit === 'stripes' || outfit === 'armor' ? 'husband' : 'heroine', x: 250, y: 740, outfit, expr: 'proud', pose: 'hips' }]);
  const p = row('props and scenes');
  tile(p, 'sofa + husband sit', 1100, 700, [{ art: 'sofa', x: 550, y: 680 }, { art: 'husband', x: 400, y: 680, pose: 'sit', expr: 'grumpy', hold: 'remote' }, { art: 'heroine', x: 760, y: 680, pose: 'pop', expr: 'bliss' }]);
  tile(p, 'bed + torch', 1100, 760, [{ art: 'bed', x: 550, y: 740 }, { art: 'husband', x: 334, y: 550, pose: 'lie', expr: 'sleepy' }, { art: 'heroine', x: 766, y: 550, pose: 'lie', expr: 'sneaky', look: 1, scale: 0.95 }, { art: 'blanket', x: 550, y: 740, torch: 'right' }]);
  tile(p, 'armor (stand)', 600, 820, [{ art: 'armor', x: 300, y: 800 }]);
  tile(p, 'husband in armor, visor up', 600, 820, [{ art: 'husband', x: 300, y: 790, outfit: 'armor', expr: 'proud', pose: 'hips' }]);
  tile(p, 'hall + chairs + urn + support group', 1600, 900, [{ art: 'room', kind: 'hall', w: 1600, h: 900, floorY: 620, windowX: 0.6, plantX: 0.05, plantScarf: '#e8505b', outside: [{ art: 'husband', x: 960, y: 520, scale: 0.5, pose: 'bust', outfit: 'armor', visor: 'down', plumes: 3 }] },
    { art: 'urn', x: 1420, y: 700, scale: 0.9 },
    ...[[260, 'nils', 'neutral'], [560, 'greta', 'happy'], [860, 'heroine', 'shocked'], [1160, 'penny', 'happy']].flatMap(([x, art, expr]) => [{ art: 'chair', x, y: 860, scale: 0.85 }, { art, x, y: 860, scale: 0.85, pose: 'sit', expr }])]);
  tile(p, 'armor: plumes 4 + knitted cozy', 600, 820, [{ art: 'husband', x: 300, y: 790, outfit: 'armor', visor: 'down', plumes: 4, cozy: '#f27eb2', expr: 'proud', pose: 'hips' }]);
  tile(p, 'burst + sparkles + torch', 700, 600, [{ art: 'burst', x: 260, y: 260 }, { art: 'sparkles', x: 520, y: 180 }, { art: 'torch', x: 520, y: 520 }]);
  tile(p, 'plant: eyes sad, wide, smug, happy + scarf, bud, sweat', 1100, 420, ['sad', 'wide', 'smug', 'happy'].map((eyes, i) => ({ art: 'plant', x: 140 + i * 270, y: 400, eyes, scarf: i === 2 ? '#e8505b' : undefined, bud: i === 1, sweat: i === 1 })));
}

if (params.has('kit')) showKit();
const bar = document.getElementById('bar');
const log = document.getElementById('log');
const nameBox = document.getElementById('name');
const stillBox = document.getElementById('still');
nameBox.value = params.get('name') ?? '';
stillBox.checked = params.has('still');
const sound = createSound();

/** Play one strip with the options on the page. @param {object} strip the strip @returns {object} the player */
function open(strip) {
  sound.unlock();
  const problems = validateStrip(strip, { hasKey: hasString, sounds: SOUND_TABLE, arts: ARTS });
  strip.panels.forEach((p, i) => p.scene.layers.forEach((l) => {
    if (l.art) for (const e of checkArtLayer(l)) problems.push(`${strip.id} panel ${i + 1}: ${e}`);
  }));
  log.textContent = problems.length ? problems.join('\n') : '';
  return playComic(strip, {
    name: nameBox.value.trim(), reducedMotion: stillBox.checked || undefined, sound, arts: ARTS,
    onSeen: (id, info) => { log.textContent += `seen: ${id}${info.skipped ? ' (skipped)' : ''}\n`; },
  });
}

await loadStrings('en');
// The chooser: one button per strip (panel count in brackets), plus a link to the art kit preview.
for (const strip of [...STRIPS].reverse()) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = `${strip.id} (${strip.panels.length})`;
  b.title = t(strip.title);
  b.addEventListener('click', () => open(strip));
  bar.prepend(b);
}
const kitLink = document.createElement('a');
kitLink.href = '?kit&zoom=2';
kitLink.textContent = 'art kit';
kitLink.style.color = '#9fe';
bar.append(kitLink);
const pick = STRIPS.find((s) => s.id === params.get('strip'));
if (pick) {
  const player = open(pick);
  for (let i = 0; i < Number(params.get('step') ?? 0); i += 1) player.next();
}
</script>
</body>
</html>
