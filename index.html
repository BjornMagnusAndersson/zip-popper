<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f48fb1">
<title>Popper</title>
<link rel="stylesheet" href="./css/pop.css">
<style>
  html, body { height: 100%; margin: 0; background: #5c6857; }
  #game { height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<main id="game"></main>
<script type="module">
// The pop scene demo: one full face to clear. Serve this folder with: npx serve src (ES modules need http, not file://)
// Optional for testing: ?seed=123 (always the same first face), ?strip (a blackhead strip on the nose),
// ?tier=1 (the studio room behind the face: 0 dingy, 1 better, 2 spa).
import { loadStrings, t } from './js/core/strings.js';
import { createPopMode } from './js/pop/pop-mode.js';
await loadStrings('en');
document.title = t('pop.region');
const params = new URLSearchParams(location.search);
const tier = Math.max(0, Math.min(2, Math.floor(Number(params.get('tier')) || 0)));
const pop = createPopMode({ t, storage: localStorage, seed: Number(params.get('seed')) || undefined, strip: params.has('strip'), tier });
pop.mount(document.getElementById('game'));
</script>
<script type="module">
import { registerServiceWorker } from './js/core/pwa.js';
registerServiceWorker();
</script>
</body>
</html>
