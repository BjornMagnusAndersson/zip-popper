<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./popper.webmanifest">
<meta name="theme-color" content="#f48fb1">
<title>Zit Happens</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/comic.css">
<link rel="stylesheet" href="./css/pop.css">
<link rel="stylesheet" href="./css/phone-scroll.css">
<style>
  html, body { height: 100%; margin: 0; background: #f48fb1; overflow: hidden; }
  #game { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
</style>
</head>
<body>
<main id="game"></main>
<script type="module">
// The game (T3.1c): the app router in js/game/app.js shows every screen. Serve this folder with: npx serve src
// (ES modules need http, not file://). Testing flags: see the top of js/game/app.js (?test, ?chapter=N&customer=M,
// ?money=, ?rep=, ?name=, ?seed=). ?demo shows the old pop demo instead (?demo&seed=123&tier=1&career&nostrip).
import { loadStrings, t } from './js/core/strings.js';
await loadStrings('en');
document.title = t('ui.title.name');
const params = new URLSearchParams(location.search);
const host = document.getElementById('game');
if (params.has('demo')) {
  // The old pop demo (the page before T3.1c): random faces, every tool, "New face".
  const { createPopMode } = await import('./js/pop/pop-mode.js');
  const tier = Math.max(0, Math.min(2, Math.floor(Number(params.get('tier')) || 0)));
  createPopMode({ t, storage: localStorage, seed: Number(params.get('seed')) || undefined, strip: !params.has('nostrip'), tier, career: params.has('career') }).mount(host);
} else {
  const { startApp } = await import('./js/game/app.js');
  globalThis.popperApp = startApp(host); // a handle for the browser console and screenshot runs
}
</script>
<script type="module">
import { registerServiceWorker } from './js/core/pwa.js';
registerServiceWorker();
</script>
</body>
</html>
