<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop effects test</title>
<style>
  /* Developer page: six juicier pop moments to try on a phone (look and feel only, the game is not changed).
     Options: ?v=A..F, ?kind=whitehead|big, ?who=<regular id>, ?still (calm version), ?mute, ?shot (screenshots). */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
    background: #23393a; color: #eef6f4; font: 15px/1.25 system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); }
  .group { display: flex; gap: 5px; }
  #vars { flex-wrap: wrap; } /* nine variant buttons: on a narrow upright phone they take two rows */
  .bar button { font: 600 16px system-ui, sans-serif; min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: 12px;
    border: 1px solid #6b9; background: #2f4c4d; color: inherit; cursor: pointer; touch-action: manipulation; }
  .bar button[aria-pressed="true"] { background: #ffd84a; color: #2a1d12; border-color: #ffd84a; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #bcdcd6; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage canvas[hidden] { display: none; } /* else display: block above keeps the hidden canvas on top, catching every touch */
  #label { position: absolute; top: 6px; left: 8px; margin: 0; padding: 3px 9px; border-radius: 10px; pointer-events: none;
    background: rgba(35,57,58,0.75); color: #fff; font: 600 13px system-ui, sans-serif; }
  #hint { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); margin: 0;
    padding: 4px 12px; border-radius: 12px; pointer-events: none; white-space: nowrap; background: rgba(255,255,255,0.75);
    color: #18312e; font: 600 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div class="bar">
  <div class="group" id="vars" role="group" aria-label="Variant"></div>
  <div class="group">
    <button type="button" id="kind">Whitehead</button>
    <button type="button" id="snd">Sound on</button>
    <button type="button" id="replay">Replay</button>
  </div>
</div>
<div id="stage">
  <canvas id="mine"></canvas>
  <canvas id="engine" hidden></canvas>
  <p id="label"></p>
  <p id="hint"></p>
</div>
<script type="module" src="js/dev/pop-fx-test.js"></script>
</body>
</html>
